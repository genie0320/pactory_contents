[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "seed-synthesis-engine"
version = "0.1.0"
description = "Lightweight Seed Synthesis Engine & Metadata Indexing Pipeline"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.0",
    "pypdf>=5.0",
    "pypdfium2>=4.0",
    "pillow>=10.0",
    "typer>=0.9.0",
    "pyyaml>=6.0",
    "tenacity>=8.0",
    "openai>=1.0.0",
    "google-genai>=0.1.0",
    "anthropic>=0.20.0",
    "fastapi>=0.110.0",
    "uvicorn>=0.28.0",
    "python-multipart>=0.0.9",
    "streamlit>=1.30.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
