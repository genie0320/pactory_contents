services:
  pactory-studio:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: pactory-studio
    restart: unless-stopped
    ports:
      - "8501:8501"
    environment:
      - PORT=8501
    volumes:
      - ./data:/app/data
      - ./.env:/app/.env
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8501/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
